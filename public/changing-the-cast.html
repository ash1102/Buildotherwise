<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changing the Cast — Entrepalooza</title><style>*{box-sizing:border-box}body{margin:0;background:#102321;color:#f2efe6;font:17px/1.55 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:26px 20px 80px}.eyebrow{color:#d5b67b;letter-spacing:.1em;font-size:12px;font-weight:750}h1{font-size:clamp(30px,7vw,48px);line-height:1.13;margin:18px 0}h2{font-size:26px;line-height:1.2}p{color:#cad5ce}.panel{background:#1a3430;border:1px solid #45615a;border-radius:22px;padding:24px;margin-top:24px}.chip{display:inline-block;border:1px solid #64817a;border-radius:99px;padding:5px 12px;font-size:13px;color:#b7c9c2}button{font:inherit;cursor:pointer}button.option{display:block;width:100%;text-align:left;padding:15px 18px;background:#25453e;color:#f6f5ec;border:1px solid #54776e;border-radius:13px;margin:10px 0}button.option[aria-pressed=true]{background:#d5b67b;color:#152722;border-color:#d5b67b}input,textarea{display:block;width:100%;padding:14px;border-radius:12px;background:#0f2723;border:1px solid #658179;color:white;font:inherit;margin:14px 0}textarea{min-height:95px}nav{display:flex;gap:10px;justify-content:space-between;margin-top:24px}.primary,.secondary{padding:13px 20px;border-radius:12px;border:0}.primary{background:#d5b67b;color:#172821;font-weight:700}.secondary{background:#2d4c45;color:#f4f1e8}.primary:disabled{opacity:.5}.stage{min-height:175px;border:1px dashed #78938a;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:20px;margin:20px 0;background:radial-gradient(circle,#36594e,#17342e)}.actor{background:#d5b67b;color:#132822;border-radius:20px;padding:18px 22px;text-align:center;font-weight:700;max-width:90%}.hint{font-size:14px}.progress{height:5px;background:#36544c;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#d5b67b;transition:width .2s}.footer{font-size:13px;margin-top:26px;color:#9fb5aa}</style></head><body><main><div class="eyebrow">BUILD OTHERWISE / ENTREPALOOZA</div><h1>Changing the Cast</h1><p>An interactive exploration of the voices that have shaped your story—and the roles you want them to play next.</p><div class="progress"><div id="bar"></div></div><section class="panel"><span class="chip" id="count"></span><div id="scene"></div><nav><button class="secondary" id="back">Back</button><button class="primary" id="next">Continue</button></nav></section><p class="footer">Prototype only. Your responses stay in this browser tab and are not sent to a server. You can leave any question unanswered.</p></main><script>const state={voice:"",purpose:"",effect:"",role:"",experiment:""};let step=0;const scenes=[()=>'<h2>Every story has a cast.</h2><p>Some voices encourage us. Others criticize, warn, or demand. They may have entered our lives long ago. You do not have to agree with them to notice them.</p><p>In this experience, you can meet one of those voices and decide what role—if any—you want it to play.</p>',()=>'<h2>Meet a character</h2><p>Which message tends to show up in your story?</p>'+opts("voice",["I’m not good enough","I always mess things up","I can’t trust anyone","I have to be perfect","I must keep everyone happy","Something else"])+(state.voice==="Something else"?'<input id="custom" placeholder="Name the message in your own words">':"")+'<p class="hint">Choose an example or name your own. There is no right answer.</p>',()=>'<h2>What was its job?</h2><p>Can you imagine a time when this message might have served a purpose? It is also okay if it never helped.</p>'+opts("purpose",["Trying to keep me safe","Helping me avoid rejection","Pushing me to achieve","Helping me stay prepared","I don’t think it helped me","I’m not sure"] ),()=>'<h2>What happens now?</h2><p>When this character speaks today, what impact does it have?</p>'+opts("effect",["It sometimes helps","It mostly holds me back","Both, depending on the situation","I’m still figuring that out"] )+'<div class="stage"><div class="actor">'+safe(state.voice||"Your character")+'</div></div><p class="hint">Notice: a familiar voice can be loud without being in charge.</p>',()=>'<h2>Change the role</h2><p>You can keep what is useful without keeping the old job. What would you like this character to do now?</p>'+opts("role",["Become a thoughtful reviewer instead of a critic","Help me set boundaries instead of shutting people out","Encourage curiosity instead of demanding perfection","Move to the sidelines","Leave the stage","I’m not ready to decide"] )+'<div class="stage"><div class="actor">'+safe(state.role||"You decide who takes center stage")+'</div></div>',()=>'<h2>Try a new response</h2><p>When this voice shows up again, what is one small response you could experiment with? You do not have to force yourself to believe something new.</p><textarea id="experiment" placeholder="For example: I’ll notice the warning, then ask what evidence I have before deciding.">'+safe(state.experiment)+'</textarea><p class="hint">An experiment is an invitation, not a promise.</p>',()=>'<h2>You are more than one character.</h2><p>You met a recurring message, explored what it may have done, and considered what role it could have next.</p><div class="stage"><div class="actor">'+safe(state.voice||"Your character")+'<div style="font-size:13px;font-weight:400;margin-top:6px">'+safe(state.role||"Its role is yours to consider")+'</div></div></div><p>Nothing here requires you to erase your past. You can revisit the question whenever you want.</p><button class="secondary" onclick="step=0;render()">Start again</button>'];function safe(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function opts(key,values){return values.map(v=>'<button class="option" data-key="'+key+'" data-value="'+safe(v)+'" aria-pressed="'+(state[key]===v)+'">'+safe(v)+'</button>').join("")}function render(){document.getElementById("count").textContent="SCENE "+(step+1)+" OF "+scenes.length;document.getElementById("bar").style.width=((step+1)/scenes.length*100)+"%";document.getElementById("scene").innerHTML=scenes[step]();document.getElementById("back").style.visibility=step?"visible":"hidden";document.getElementById("next").textContent=step===scenes.length-1?"Finish":"Continue";document.getElementById("next").style.display=step===scenes.length-1?"none":"block";document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{state[b.dataset.key]=b.dataset.value;render()});const t=document.getElementById("experiment");if(t)t.oninput=()=>state.experiment=t.value;const c=document.getElementById("custom");if(c)c.oninput=()=>state.custom=c.value}document.getElementById("back").onclick=()=>{if(step>0){step--;render()}};document.getElementById("next").onclick=()=>{if(step===1&&state.voice==="Something else"&&state.custom)state.voice=state.custom;if(step<scenes.length-1){step++;render()}};render();</script></body></html>
